name: Dataform CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compile:
    name: Compile Dataform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile Dataform
        run: npx dataform compile
